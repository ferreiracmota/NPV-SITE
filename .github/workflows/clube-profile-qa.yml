name: NPV — QA do Meu Perfil
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/ClubeStudentProfile.*'
      - 'src/ClubeNPVOnline.jsx'
      - 'clube/profile/**'
      - 'api/clube/profile.js'
      - '.github/workflows/clube-profile-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  profile-tests-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --test clube/profile/*.test.mjs
      - run: pnpm run build
