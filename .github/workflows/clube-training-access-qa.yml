name: NPV — Acesso aos treinos Hotmart
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/ClubeNPVOnline.jsx'
      - 'src/ClubeTrainingNav.css'
      - 'clube/hotmart/trainingAccess.*'
      - '.github/workflows/clube-training-access-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  training-link:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testar URL da area de membros e seguranca do atalho
        run: node --test clube/hotmart/trainingAccess.test.mjs
