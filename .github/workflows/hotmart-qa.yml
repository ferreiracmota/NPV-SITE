name: Hotmart NPV — testes isolados (sem lançamento)
on:
  push:
    branches: [feature/hotmart-renovacoes-seguro-20261020]
    paths:
      - 'api/hotmart/**'
      - 'clube/migrations/20261020_hotmart_integracao_pendente.sql'
      - '.github/workflows/hotmart-qa.yml'
  pull_request:
    branches: [main]
    paths:
      - 'api/hotmart/**'
      - 'clube/migrations/20261020_hotmart_integracao_pendente.sql'
      - '.github/workflows/hotmart-qa.yml'
  workflow_dispatch:
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar sintaxe JS de produção e código de teste
        run: |
          node --check api/hotmart/core.mjs
          node --check api/hotmart/webhook.js
          node --check api/hotmart/reconcile.js
          node --check api/hotmart/core.test.mjs
      - name: Executar cenários simulados sem credenciais, rede ou banco real
        run: node --test api/hotmart/core.test.mjs
