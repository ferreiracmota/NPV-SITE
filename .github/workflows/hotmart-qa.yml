name: Hotmart NPV — testes isolados (sem lançamento)
on:
  push:
    branches: [feature/hotmart-renovacoes-seguro-20261020]
    paths:
      - 'api/hotmart/**'
      - 'clube/hotmart/**'
      - 'clube/migrations/20261020_hotmart_integracao_pendente.sql'
      - '.github/workflows/hotmart-qa.yml'
  pull_request:
    branches: [main]
    paths:
      - 'api/hotmart/**'
      - 'clube/hotmart/**'
      - 'clube/migrations/20261020_hotmart_integracao_pendente.sql'
      - '.github/workflows/hotmart-qa.yml'
  workflow_dispatch:
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências para validar o endpoint e compilar o site
        run: |
          corepack enable
          corepack pnpm install --frozen-lockfile
      - name: Validar sintaxe JS de produção e código de teste
        run: |
          node --check clube/hotmart/core.mjs
          node --check api/hotmart/webhook.js
          node --check api/hotmart/reconcile.js
          node --check clube/hotmart/discovery.mjs
          node --check clube/hotmart/discovery.test.mjs
          node --check clube/hotmart/core.test.mjs
          node --check api/hotmart/identify.js
          node --check clube/hotmart/identify-core.mjs
          node --check clube/hotmart/identify.test.mjs
          node --check clube/hotmart/identify-handler.test.mjs
          node --check clube/hotmart/competencies.mjs
      - name: Executar cenários simulados sem credenciais, rede ou banco real
        run: node --test clube/hotmart/*.test.mjs
      - name: Compilar frontend sem publicar
        run: corepack pnpm run build

  pg_integration:
    name: PostgreSQL real descartável (sem Supabase)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: npv_test_only
          POSTGRES_DB: hotmart_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hotmart_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: npv_test_only
      PGDATABASE: hotmart_ci
    steps:
      - uses: actions/checkout@v4
      - name: Instalar cliente PostgreSQL quando ausente
        run: |
          if ! command -v psql; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
      - name: Criar banco sintético, aplicar migração pendente e exercitar RPCs
        run: |
          psql -v ON_ERROR_STOP=1 -f clube/hotmart/pg/fixture.sql
          psql -v ON_ERROR_STOP=1 -f clube/migrations/20261020_hotmart_integracao_pendente.sql
          psql -v ON_ERROR_STOP=1 -f clube/hotmart/pg/scenarios.sql
          psql -v ON_ERROR_STOP=1 -f clube/hotmart/pg/permissions.sql
      - name: Testar travas entre duas conexões simultâneas
        run: bash clube/hotmart/pg/concurrent.sh
