name: NPV — Aba Hotmart Admin QA (isolado)
on:
  push:
    branches: [feature/hotmart-admin-live-readonly-20261021]
    paths:
      - 'src/ClubeHotmartAdmin.*'
      - 'src/ClubeNPVOnline.jsx'
      - 'api/clube/hotmart-admin.js'
      - 'clube/hotmart-admin/**'
      - 'qa/hotmart-admin/**'
      - '.github/workflows/hotmart-admin-qa.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/ClubeHotmartAdmin.*'
      - 'src/ClubeNPVOnline.jsx'
      - 'api/clube/hotmart-admin.js'
      - 'clube/hotmart-admin/**'
      - 'qa/hotmart-admin/**'
      - '.github/workflows/hotmart-admin-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar sem modificar lockfile
        run: |
          corepack enable
          corepack pnpm install --frozen-lockfile
      - name: Testes de autorização, dados vazios e separação do PR 14
        run: node --test qa/hotmart-admin/*.test.mjs
      - name: Compilar site sem publicar
        run: corepack pnpm run build
  browser-responsive:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Dependências da aplicação
        run: |
          corepack enable
          corepack pnpm install --frozen-lockfile
      - name: Instalar navegadores de teste
        run: |
          npm install --prefix /tmp/npv-playwright --no-save --ignore-scripts --no-package-lock playwright@1.56.1
          /tmp/npv-playwright/node_modules/.bin/playwright install --with-deps chromium webkit
      - name: Executar interface isolada com resposta vazia (sem Supabase real)
        run: |
          corepack pnpm exec vite --host 127.0.0.1 --port 4179 --strictPort >/tmp/npv-hotmart-vite.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4179/qa/hotmart-admin/harness.html >/dev/null; then break; fi
            sleep 2
          done
          node qa/hotmart-admin/visual.mjs
      - name: Guardar capturas (somente dados fictícios da suíte)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npv-hotmart-admin-responsive
          path: qa/artifacts/hotmart-admin/
          retention-days: 14
