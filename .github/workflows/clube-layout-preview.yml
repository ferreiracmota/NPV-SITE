name: Validar prévia da home Clube NPV
on:
  push:
    branches: [preview/clube-home-layout-20261017]
    paths:
      - src/**
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/clube-layout-preview.yml
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Instalar dependências
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Validar projeto React
        run: pnpm run build
