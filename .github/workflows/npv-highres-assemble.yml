name: NPV - incorporar video original HD e fallback animado
on:
  push:
    branches:
      - feature/npv-video-hd-autoplay-loop-20261023
permissions:
  contents: write
jobs:
  transferir-midias:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Reconstruir MP4 sem perda e WebP animado, validando hashes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/videos
          cat .npv-highres-transfer/mp4/part-*.b64 | base64 --decode > public/videos/npv-plataforma-original-20261023.mp4
          cat .npv-highres-transfer/webp/part-*.b64 | base64 --decode > public/videos/npv-plataforma-loop.webp
          echo 'a9d959e2c1f6f43732c9fb0674dbddaea6b10a8da06f451fd7961beed83502e5  public/videos/npv-plataforma-original-20261023.mp4' | sha256sum -c -
          echo '3fe57b217bdc0645b808efe2f283bc4bf31417b263f22f94a2c33eba355906b9  public/videos/npv-plataforma-loop.webp' | sha256sum -c -
          test "$(wc -c < public/videos/npv-plataforma-original-20261023.mp4)" -eq 6582162
          test "$(wc -c < public/videos/npv-plataforma-loop.webp)" -eq 2341674
          file public/videos/npv-plataforma-original-20261023.mp4 public/videos/npv-plataforma-loop.webp
      - name: Versionar apenas as midias finais
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r -- .npv-highres-transfer
          git rm -- .github/workflows/npv-highres-assemble.yml
          git add public/videos/npv-plataforma-original-20261023.mp4 public/videos/npv-plataforma-loop.webp
          git commit -m 'feat(site): video HD real e loop animado sem clique'
          git push origin HEAD:feature/npv-video-hd-autoplay-loop-20261023
