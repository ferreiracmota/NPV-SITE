name: NPV - Limpeza temporaria das bordas dos versos
on:
  push:
    branches:
      - fix/clube-versos-sem-bordas-pretas-20261030
permissions:
  contents: write
jobs:
  clean-card-edges:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - name: Limpar fundo preto externo mantendo as artes originais
        run: |
          python -m pip install --disable-pip-version-check Pillow==11.3.0
          python - <<'PY'
          from PIL import Image
          from pathlib import Path

          files = ("bronze", "prata", "ouro", "platinum", "diamante", "black")
          for name in files:
              path = Path("public/clube/cards/back") / (name + ".webp")
              im = Image.open(path).convert("RGBA")
              w, h = im.size
              assert (w, h) == (1600, 900), (name, im.size)
              pixels = im.load()
              fixed = 0

              def clean(x, y, lower, upper):
                  global fixed
                  r, g, b, a = pixels[x, y]
                  if not a:
                      return
                  brightness = max(r, g, b)
                  new_alpha = (0 if brightness <= lower else
                               255 if brightness >= upper else
                               round(255 * (brightness - lower) / (upper - lower)))
                  if new_alpha < a:
                      pixels[x, y] = (r, g, b, new_alpha)
                      fixed += 1

              for y in range(h - 17, h):
                  for x in range(w):
                      clean(x, y, 10, 65)

              for y in range(h):
                  for x in list(range(7)) + list(range(w - 7, w)):
                      clean(x, y, 12, 38)

              for y in list(range(75)) + list(range(h - 75, h)):
                  for x in list(range(95)) + list(range(w - 95, w)):
                      clean(x, y, 12, 45)

              im.save(path, "WEBP", quality=94, method=6, exact=True)
              verify = Image.open(path).convert("RGBA")
              assert verify.getpixel((w // 2, h - 1))[3] == 0, name
              assert verify.getpixel((w // 2, h - 18))[3] == 255, name
              print(f"{name}: pixels de borda tratados = {fixed}; bytes = {path.stat().st_size}")
          PY
      - name: Registrar os seis novos WebP na mesma branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/clube/cards/back/*.webp
          if ! git diff --cached --quiet; then
            git commit -m "fix(clube): remover pixels pretos externos dos seis versos"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
