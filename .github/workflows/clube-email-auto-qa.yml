name: NPV — QA notificacoes automaticas por e-mail
on:
  pull_request:
    branches: [main]
    paths:
      - 'api/clube/email-*.js'
      - 'clube/email/**'
      - 'src/ClubeNPVOnline.jsx'
      - 'src/ClubeEmailAdmin.*'
      - 'api/clube/student-connections.js'
      - 'vercel.json'
      - '.github/workflows/clube-email-auto-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  email-tests-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Instalar dependencias sem alterar lockfile
        run: pnpm install --frozen-lockfile
      - name: Testar regras de email, preferencia e cancelamento
        run: node --test clube/email/*.test.mjs
      - name: Verificar rotas e modelos do administrador
        run: |
          node --check clube/email/unsubscribe-handler.mjs
          node --check clube/email/admin-handler.mjs
          node --check api/clube/email-daily.js
          node --check api/clube/student-connections.js
          node --test qa/vercel/*.test.mjs
      - name: Compilar site completo
        run: pnpm run build
