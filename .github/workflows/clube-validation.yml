name: Clube NPV — validate React build
on:
  push:
    branches: [feat/clube-npv-piloto-2026-10]
    paths:
      - src/**
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/clube-validation.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install using frozen lockfile
        run: pnpm install --frozen-lockfile
      - name: Build React and Vite
        run: pnpm run build
      - name: Type-check all club JSX syntax
        run: |
          node -e "const fs=require('fs'); const {transformSync}=require('esbuild'); for (const f of ['src/ClubeNPV.jsx','src/ClubeRecompensas.jsx','src/ClubeNPVOnline.jsx']) transformSync(fs.readFileSync(f,'utf8'),{loader:'jsx'}); console.log('Clube syntax validated')"
