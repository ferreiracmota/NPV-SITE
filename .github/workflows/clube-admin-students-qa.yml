name: NPV — QA histórico de Alunos (admin)
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/ClubeAdminStudents.*'
      - 'clube/admin-students/**'
      - '.github/workflows/clube-admin-students-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Instalar dependências sem alterar o lockfile
        run: pnpm install --frozen-lockfile
      - name: Testar saldos e histórico sem acesso a dados reais
        run: node --test clube/admin-students/*.test.mjs
      - name: Compilar site completo sem publicar
        run: pnpm run build
