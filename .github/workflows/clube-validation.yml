name: Clube NPV — validate React build
on:
  push:
    branches: [feat/clube-npv-piloto-2026-10]
    paths:
      - src/**
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/clube-validation.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install using frozen lockfile
        run: pnpm install --frozen-lockfile
      - name: Build React and Vite
        run: pnpm run build
